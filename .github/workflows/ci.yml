name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pmr
          POSTGRES_PASSWORD: pmr_secret
          POSTGRES_DB: pmr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, bcmath, gd, zip, intl, dom, xml
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

      - name: Build assets
        run: npm run build

      - name: Migration smoke test (PostgreSQL)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: pmr_ci
          DB_USERNAME: pmr
          DB_PASSWORD: pmr_secret
        run: php artisan migrate:fresh --force --no-interaction

      - name: Dependency audit (composer)
        run: composer audit --no-interaction

      - name: Dependency audit (npm, critical only)
        run: npm audit --audit-level=critical
