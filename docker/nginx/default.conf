server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12M;

    # Header keamanan utama diatur di Laravel (SecurityHeaders middleware,
    # termasuk CSP) — docs/08 §2.4. Lokasi file statis di bawah menambahkan
    # header dasar karena tidak melewati PHP.

    # Paksa HTTPS di Nginx (docs/08 §2.4).
    # Bila request masuk via HTTP dari pengunjung (dideteksi via Cloudflare / reverse proxy
    # header X-Forwarded-Proto = "http"), arahkan ke HTTPS secara permanen (301).
    # Akses langsung localhost / 127.0.0.1 (development lokal & internal Docker healthcheck)
    # tidak terpengaruh karena tidak mengirimkan header ini.
    # Catatan: Bila Origin Certificate Cloudflare / Let's Encrypt dipasang langsung pada Nginx
    # (port 443 ssl), buat blok `server { listen 80; return 301 https://$host$request_uri; }`
    # terpisah sesuai petunjuk di docs/09 §3 & §4.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # IP klien asli di balik Cloudflare (docs/09 §3). Tanpa ini semua pengunjung
    # tampak berasal dari IP edge Cloudflare, sehingga rate limit per IP (login,
    # check-in, throttle publik) dipakai bersama. CF-Connecting-IP HANYA dipercaya
    # bila koneksi datang dari range Cloudflare (tidak dapat dipalsukan dari luar).
    # Daftar: https://www.cloudflare.com/ips — periksa & perbarui berkala.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Endpoint dinamis Livewire (/livewire-{hash}/livewire.js, /update, dst.)
    # HARUS sebelum regex statis di bawah — `^~` menonaktifkan cek regex,
    # jika file tidak ada (memang dinamis) jatuh ke index.php.
    location ^~ /livewire- {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    # Larang akses file tersembunyi (kecuali .well-known untuk ACME)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|pdf|mp4|webp)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
