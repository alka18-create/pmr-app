server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12M;

    # Header keamanan utama diatur di Laravel (SecurityHeaders middleware,
    # termasuk CSP) — docs/08 §2.4. Lokasi file statis di bawah menambahkan
    # header dasar karena tidak melewati PHP.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Endpoint dinamis Livewire (/livewire-{hash}/livewire.js, /update, dst.)
    # HARUS sebelum regex statis di bawah — `^~` menonaktifkan cek regex,
    # jika file tidak ada (memang dinamis) jatuh ke index.php.
    location ^~ /livewire- {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    # Larang akses file tersembunyi (kecuali .well-known untuk ACME)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|pdf|mp4|webp)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
