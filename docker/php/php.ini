date.timezone = Asia/Jakarta
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
max_input_time = 60
expose_php = Off

; Opcache — validate_timestamps tetap ON agar perubahan kode terbaca saat dev.
; Produksi boleh dimatikan (0) via file tambahan bila perlu (docs/09_DEPLOYMENT.md).
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
