# Compose produksi — lihat docs/09_DEPLOYMENT.md
# - Postgres/Redis TIDAK dipublish ke host
# - Semua service restart otomatis
# - TLS (443) ditambahkan di Nginx saat origin cert terpasang (docs/09 §4)
name: pmr-system

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmr-app:prod
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmr-app:prod
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan queue:work redis --queue=exports,certificates,default --sleep=3 --tries=3 --max-time=3600
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmr-app:prod
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # aktifkan saat origin cert terpasang (docs/09)
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pmr
      POSTGRES_USER: pmr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env produksi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmr -d pmr"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
